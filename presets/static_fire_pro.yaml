name: Static Fire Pro (Motor Burn Card)
description: Compact all-in-one rocket motor burn telemetry card (live thrust, peak, impulse, NAR/TRA class, burn phase, curve & animated nozzle plume).

output:
  resolution: 1080p
  fps: 60

time:
  speed: 1.0
  ramps:
    - from: 1.4
      to: 3.6
      speed: 0.25
      ease: 0.25
      label: burn

theme:
  base: night
  palette: rocket
  accent: "#ff9f0a"

events:
  - detect: [thrust, thrust_above_rest, force]
    fraction: 0.05
  - edges: [pyro_active, pyro_energised, pyro]
    label: PYRO
    optional: true

widgets:
  - type: motor_burn
    name: motor_burn_card
    channel: [thrust, thrust_above_rest, force]
    x: 4%
    y: 62%
    width: 820
    height: 360
    show_plume: true
    show_class: true
    show_kgf: true
    zero_on_ignition: true

  - type: led
    name: pyro
    channel: [pyro_active, pyro_energised, pyro]
    optional: true
    x: 4%
    y: 55%
    label: Pyro
    on_text: Pyro armed
    off_text: Pyro off
    size: 14
    label_size: 22

  - type: gauge
    name: thrust_gauge
    channel: [thrust, thrust_above_rest, force]
    x: 96%
    y: 62%
    anchor: top-right
    width: 270
    height: 270
    min: 0
    label: Thrust
    format: "{:.0f}"
    show_scale: true
    peak_marker: true

  - type: progress
    name: clip_progress
    x: 4%
    y: 96.5%
    width: 92%
    height: 26
    thickness: 6
