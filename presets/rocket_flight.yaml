name: Rocket Launch Flight Dashboard (with 3D Attitude & Motor Burn)
description: Full rocket launch dashboard with true 3D tilt visualizer, motor burn curve/impulse card, altitude ladder tape, velocity and flight phase badge.

output:
  resolution: 1080p
  fps: 60

time:
  speed: 1.0

theme:
  base: night
  palette: rocket
  accent: "#ff9f0a"

events: true

widgets:
  - type: label
    name: title
    text: FLIGHT TELEMETRY
    x: 4%
    y: 4%
    size: 36
    tracking: 5
    uppercase: true

  - type: timer
    name: mission_clock
    x: 4%
    y: 9.5%
    label: mission elapsed
    size: 48
    style: t+
    decimals: 2
    show_speed: true

  - type: badge
    name: phase_badge
    channel: [phase, flight_phase, state, mode]
    label: Phase
    x: 4%
    y: 20%
    size: 20
    colors:
      pad: "#64748b"
      boost: "#ff453a"
      burn: "#ff453a"
      coast: "#ff9f0a"
      apogee: "#38bdf8"
      descent: "#34c759"
      chute: "#34c759"
      landed: "#a855f7"
    optional: true

  - type: readout
    name: alt_big
    channel: [altitude, alt, baro_altitude]
    label: Altitude
    x: 4%
    y: 27.5%
    value_size: 72
    format: "{:.0f}"
    optional: true

  - type: readout
    name: vel_big
    channel: [velocity, speed, vspeed]
    label: Velocity
    x: 4%
    y: 41%
    value_size: 52
    format: "{:.1f}"
    optional: true

  - type: rocket_3d
    name: rocket_3d_attitude
    title: 3D Attitude
    x: 86.5%
    y: 5%
    anchor: top-right
    width: 320
    height: 370
    optional: true

  - type: tape
    name: alt_ladder
    channel: [altitude, alt, baro_altitude]
    label: ALT
    side: right
    x: 96%
    y: 5%
    anchor: top-right
    width: 130
    height: 370
    optional: true

  - type: motor_burn
    name: motor_burn_card
    channel: [thrust, thrust_above_rest, force]
    x: 4%
    y: 59%
    width: 790
    height: 350
    zoom_burn: true
    optional: true

  - type: graph
    name: flight_profile
    title: Altitude Profile
    channel: [altitude, alt, baro_altitude]
    x: 48%
    y: 59%
    width: 48%
    height: 32.5%
    mode: full
    show_value: true
    fill: true
    gradient: true
    optional: true

  - type: progress
    name: mission_bar
    x: 4%
    y: 95%
    width: 92%
    height: 32
