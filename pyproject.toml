[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-overlay"
version = "1.0.0"
description = "Animated telemetry overlays with a transparent background, rendered from CSV/XLSX logs for DaVinci Resolve and other editors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["telemetry", "overlay", "video", "davinci-resolve", "rocketry",
            "data-visualisation", "alpha-channel", "prores"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.5",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
telemetry-overlay = "telemetry_overlay.cli:main"

[tool.setuptools]
packages = ["telemetry_overlay", "telemetry_overlay.widgets"]

[tool.setuptools.package-data]
telemetry_overlay = ["../presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
