[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-overlay"
version = "2.0.0"
description = "Universal telemetry extractor, converter and animated overlay renderer for GoPro, DJI, Garmin FIT, GPX, IGC, NMEA, CSV and XLSX."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "telemetry", "overlay", "extractor", "video", "davinci-resolve", "gopro",
    "gpmf", "dji", "garmin", "fit", "gpx", "rocketry", "motorsport", "aviation",
    "data-visualisation", "alpha-channel", "prores",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.5",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
telemetry-overlay = "telemetry_overlay.cli:main"

[tool.setuptools]
packages = [
    "telemetry_overlay",
    "telemetry_overlay.widgets",
    "telemetry_overlay.formats",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
